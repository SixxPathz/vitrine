name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA (leave empty to use the one scripts/upload-ipa.ps1 uploaded)"
        required: false
        default: ""
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    # Draft releases are visible only to accounts with push access, so reading the uploaded IPA needs write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      # Without a link, the IPA comes from the ipa-input draft release that scripts/upload-ipa.ps1 fills from
      # your PC. A draft stays hidden from everyone but you, even in a public fork.
      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ipa
          if [ -n "$IPA_URL" ]; then
            curl -fsSL "$IPA_URL" -o ipa/spotify.ipa
          else
            gh release download ipa-input --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --output ipa/spotify.ipa \
              || { echo "::error::No ipa_url given and no .ipa on the ipa-input draft release. Upload one with scripts/upload-ipa.ps1."; exit 1; }
          fi
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - run: make release

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
